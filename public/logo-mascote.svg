  <circle cx="116" cy="74" r="2.6" fill="#111114"/>
  <!-- Bochechas e boca aberta gritando -->
  <circle cx="62" cy="96" r="8" fill="#e0716a" fill-opacity="0.45"/>
  <circle cx="138" cy="96" r="8" fill="#e0716a" fill-opacity="0.45"/>
